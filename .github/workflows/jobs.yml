name: job-alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you click "Run workflow" by hand
  push:                       # test run whenever the checker itself changes
    branches: [main]
    paths: [check_jobs.py, .github/workflows/jobs.yml]

permissions:
  contents: write             # needed to save seen.json back to the repo

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check career sites
        run: python check_jobs.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen jobs
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json status.json
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
